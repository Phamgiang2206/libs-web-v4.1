let menu=[],addons=[],cart=[],token=localStorage.getItem('libsToken3')||'',user=null,orders=[],page='home',cat='all';const $=id=>document.getElementById(id),money=n=>n.toLocaleString('vi-VN')+'đ',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,b,method='POST',key=''){let r=await fetch('/api/'+p,{method:b===undefined?'GET':method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,'x-admin-key':key},...(b===undefined?{}:{body:JSON.stringify(b)})});let j=await r.json();if(!r.ok){const e=Error(j.error||'Lỗi');e.status=r.status;throw e;}return j}async function refresh(){if(token)try{({user,orders}=await api('me'))}catch(e){if(e.status===401){user=null;orders=[];token='';localStorage.removeItem('libsToken3')}else throw e;}}window.upgradeTier=async()=>{if(!user)return show('account');if(!confirm('Dùng 1.500 điểm để nâng hạng Gold?'))return;try{await api('upgrade',{});await show('rewards')}catch(e){alert(e.message)}};window.redeemItem=async id=>{await refresh();if(!user)return show('account');const x=menu.find(m=>m.id===id);const used=cart.filter(i=>i.redeem).reduce((n,i)=>n+(menu.find(m=>m.id===i.id)?.price||0)*i.quantity/100,0);if(user.points<used+x.price/100)return alert('Bạn chưa đủ điểm');cart.push({id,quantity:1,price:x.price,extras:[],drinks:Array(x.category==='combo'?(id.startsWith('share')?2:1):0).fill('coke'),upgrade:false,redeem:true});save();show('cart')};function save(){try{localStorage.setItem('libsCart3',JSON.stringify(cart))}catch{};const n=cart.reduce((s,x)=>s+x.quantity,0);$('count').textContent=n;const bar=$('basket');bar.hidden=!n||page==='cart';bar.textContent=`Xem giỏ hàng (${n}) · ${money(cart.reduce((s,x)=>s+(x.price-(x.redeem?(menu.find(m=>m.id===x.id)?.price||0):0))*x.quantity,0))}`;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}const nutrition=x=>`${x.kcal??'Chưa xác minh'} kcal · ${x.prot
